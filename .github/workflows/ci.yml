name: CI

on:
  push:
    branches: [feat/quotes-scrapper]
  pull_request:
    branches: [main]

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make
      - name: Build, run, and validate
        run: make ci
